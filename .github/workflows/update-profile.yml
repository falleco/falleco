name: Update profile stats

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calculate stats and update README
        env:
          PROFILE_USERNAME: falleco
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: python profile.py

      - name: Commit updated profile
        run: |
          if git diff --quiet; then
            echo "Profile is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md cache/stats.json
          git commit -m "Update profile stats"
          git push
